# Set the default shell to Zsh
set-option -g default-shell /bin/zsh
set-option -g status-position top

# Activează monitorizarea activității
setw -g monitor-activity on
set -g visual-activity on
set -g focus-events on

# Opțional: trimite bell când apare activitate
set -g bell-action any
set -g visual-bell on


set -g mouse on
set -g history-limit 50000

# Open windows and splits in the active pane's directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded"

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# For pane titles show add parameters
set -g pane-border-status top
set -g pane-border-format '#{pane_index}: #{pane_title}'
# End pane titles show add parameters

bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

bind R                                      \
    move-window -r\;                        \
    display-message "Windows reordered..."

# ThePrimeagen's tmux script bindings
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
bind-key -r i run-shell "tmux neww ~/.local/scripts/tmux-cht.sh"

# worktree-tui — centred popup dashboard for git worktrees + agent sessions
bind-key g display-popup -E -w 90% -h 85% \
    -b rounded -S 'fg=#89b4fa' -T ' worktree-tui ' \
    "$HOME/.local/scripts/tmux-worktrees"

# Compose long input in nvim, paste it back into the current pane. For writing
# formatted prompts for a CLI AI agent. Pastes without submitting.
# run-shell, not display-popup: only run-shell expands #{pane_id}, and the
# script needs to know which pane to paste back into. -b so nvim does not
# block the tmux command queue.
bind-key e run-shell -b "$HOME/.local/scripts/tmux-compose '#{pane_id}'"

# ============================================
# CUSTOM SIMPLE THEME - ASCII ONLY
# ============================================

# Colors (Catppuccin Mocha inspired)
set -g status-style bg='#1e1e2e',fg='#cdd6f4'

# Window status format
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# Window status colors
set -g window-status-style bg='#313244',fg='#a6adc8'
set -g window-status-current-style bg='#89b4fa',fg='#1e1e2e',bold

# Status bar content
set -g status-left " [#S] "
set -g status-left-style bg='#a6e3a1',fg='#1e1e2e',bold
set -g status-left-length 30

set -g status-right " #{b:pane_current_path} | %H:%M "
set -g status-right-style fg='#cdd6f4'
set -g status-right-length 50

# Align window list
set -g status-justify left

# Pane border colors
set -g pane-border-style fg='#313244'
set -g pane-active-border-style fg='#89b4fa'

# Message style
set -g message-style bg='#89b4fa',fg='#1e1e2e',bold

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
